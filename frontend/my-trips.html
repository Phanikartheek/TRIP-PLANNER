<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Saved Trips — AI Trip Planner</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Gautami&family=Nirmala+UI&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <header class="app-header">
        <div class="header-container">
            <a href="/" class="logo-group">
                <span class="logo-icon">✈️</span>
                <div class="logo-text">
                    <h1>AI Trip Planner</h1>
                    <span class="badge">My Trips</span>
                </div>
            </a>
            <div class="header-nav">
                <a href="/" class="btn secondary">Back to Planner</a>
                <div id="auth-widget">
                    <span id="user-email-display" class="user-badge">Loading...</span>
                    <button id="logout-btn" class="btn outline small">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <section class="card glass my-trips-section">
            <div class="section-header">
                <h2>Saved Itineraries</h2>
                <p>All completed trip plans associated with your account.</p>
            </div>
            
            <div id="trips-loading" class="loading-state">
                <div class="spinner"></div>
                <p>Loading your saved trips...</p>
            </div>

            <div id="trips-empty" class="empty-state hidden">
                <div class="empty-icon">🗺️</div>
                <h3>No saved trips found</h3>
                <p>Plan a trip while logged in to automatically save it here.</p>
                <a href="/" class="btn primary">Plan a Trip Now</a>
            </div>

            <div id="trips-grid" class="trips-grid hidden"></div>
        </section>
    </main>

    <script>
        async function loadMyTrips() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) {
                    window.location.href = '/?auth_error=login_required';
                    return;
                }
                const data = await res.json();
                document.getElementById('user-email-display').textContent = '👤 ' + data.email;

                // Auto-claim any recent trip planned before logging in
                const recentJobId = localStorage.getItem('trip_planner_last_job_id');
                if (recentJobId) {
                    try {
                        await fetch('/api/my-trips/claim', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ job_id: recentJobId }),
                        });
                    } catch (claimErr) {
                        console.debug('Trip auto-claim check:', claimErr);
                    }
                }

                const tripsRes = await fetch('/api/my-trips');
                const tripsData = await tripsRes.json();

                document.getElementById('trips-loading').classList.add('hidden');
                
                if (!tripsData.trips || tripsData.trips.length === 0) {
                    document.getElementById('trips-empty').classList.remove('hidden');
                    return;
                }

                const grid = document.getElementById('trips-grid');
                grid.classList.remove('hidden');
                grid.innerHTML = tripsData.trips.map(trip => {
                    const res = trip.result || {};
                    const city = trip.destination_city || res.destination_city || 'Destination';
                    const country = trip.destination_country || res.destination_country || 'India';
                    const days = trip.trip_length_days || res.trip_length_days || (res.days ? res.days.length : 1);
                    const curr = trip.currency || res.currency || 'INR';
                    const sym = curr === 'INR' ? '₹' : (curr === 'USD' ? '$' : (curr === 'EUR' ? '€' : curr + ' '));
                    const costVal = trip.total_estimated_cost || res.total_estimated_cost || 0;
                    const costStr = costVal > 0 ? `${sym}${Number(costVal).toLocaleString()}` : 'Budget Matched';
                    const dateStr = trip.travel_date || (trip.created_at ? new Date(trip.created_at * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : 'Flexible Date');
                    const coverImg = trip.cover_image || (res.photos && res.photos[0] ? res.photos[0].url : null);

                    return `
                        <div class="trip-card glass" style="display: flex; flex-direction: column; overflow: hidden; border-radius: 14px; background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(56, 189, 248, 0.2); transition: transform 0.2s ease, box-shadow 0.2s ease;">
                            ${coverImg ? `
                                <div style="height: 140px; width: 100%; overflow: hidden; position: relative;">
                                    <img src="${coverImg}" alt="${city}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'">
                                    <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to top, rgba(15, 23, 42, 0.9), transparent);"></div>
                                </div>
                            ` : `
                                <div style="height: 80px; width: 100%; background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.2)); display: flex; align-items: center; justify-content: center; font-size: 2rem;">
                                    ✈️
                                </div>
                            `}
                            <div style="padding: 18px; display: flex; flex-direction: column; flex: 1;">
                                <div class="trip-card-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                                    <div>
                                        <h3 style="margin: 0; font-size: 1.2rem; color: #f8fafc; font-family: 'Outfit', sans-serif;">${city}</h3>
                                        <span style="font-size: 0.8rem; color: #94a3b8;">📍 ${country}</span>
                                    </div>
                                    <span class="badge success" style="background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;">✓ Ready</span>
                                </div>
                                <div class="trip-card-body" style="font-size: 0.88rem; color: #cbd5e1; margin-bottom: 16px; flex: 1; display: flex; flex-direction: column; gap: 6px;">
                                    <div>📅 <strong>Duration:</strong> ${days} Day(s)</div>
                                    <div>💰 <strong>Est. Budget:</strong> <span style="color: #38bdf8; font-weight: 700;">${costStr}</span></div>
                                    <div>🗓️ <strong>Date:</strong> ${dateStr}</div>
                                </div>
                                <div class="trip-card-actions" style="display: flex; gap: 8px; flex-wrap: wrap;">
                                    <a href="/?job_id=${trip.job_id}" class="btn primary small" style="flex: 1; text-align: center; text-decoration: none; padding: 8px 12px; font-size: 0.85rem; font-weight: 700;">View Itinerary</a>
                                    <a href="/api/trip/${trip.job_id}/pdf" target="_blank" class="btn secondary small" style="text-decoration: none; padding: 8px 10px; font-size: 0.85rem; font-weight: 600;">📄 PDF</a>
                                    <a href="/api/trip/${trip.job_id}/calendar.ics" class="btn secondary small" style="text-decoration: none; padding: 8px 10px; font-size: 0.85rem; font-weight: 600;">📅 ICS</a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('trips-loading').innerHTML = '<p class="error-msg">Failed to load trips. Please try refreshing.</p>';
            }
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        });

        loadMyTrips();
    </script>
</body>
</html>
