services:
  trip-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trip-planner-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./jobs.db:/app/jobs.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
