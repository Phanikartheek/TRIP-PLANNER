[project]
name = "trip-planner"
version = "0.1.0"
description = "Multi-agent trip planning system built with CrewAI"
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[litellm]>=0.86.0",
    "crewai-tools>=0.17.0",
    "ddgs>=9.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[project.scripts]
trip-planner = "trip_planner.main:run"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
