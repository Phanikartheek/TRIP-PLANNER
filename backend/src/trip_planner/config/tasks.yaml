select_city_task:
  description: >-
    Evaluate destinations from: {cities}. Traveler is departing from {origin} for a {trip_length}-day trip with interests in {interests} and budget of {budget}.
    Search web for weather/seasonal conditions and typical daily costs.
    CRITICAL SINGLE VS MULTI-DESTINATION RULE: If {cities} contains exactly ONE destination (e.g. "Vijayawada"), this is strictly a single-destination trip. Set `city` to that exact city and set `cities_visited` to null. Do NOT add, invent, or suggest any other cities. ONLY if {cities} explicitly contains multiple comma-separated cities (e.g. "Goa, Gokarna, Munnar") does the user want to visit multiple destinations; in that case, sequence ALL listed cities into an ordered route, set `city` to the first city, and `cities_visited` to the ordered list of all requested cities.
  expected_output: >-
    Destination recommendation with country, justification, best time to visit, currency code, estimated daily budget, and `cities_visited` containing the complete ordered list of all requested cities (or null for single city).
  agent: city_selector

gather_city_info_task:
  description: >-
    Research the chosen destination(s) from select_city_task. If multiple cities are in `cities_visited`, you MUST research top attractions, local food gems, safety, and transit connections for EVERY city listed in `cities_visited`.
    Use web search to ground info:
    1. Emergency info: Populate `emergency_info` (`nearest_hospital`, `nearest_police_station`, `national_emergency_number`: "112", `grounded`: true).
    2. Local events & festivals: Populate `local_events` (name, date_or_period, description, `events_grounded`: true).
    3. Nearby day trips: Populate `nearby_day_trips` (name, distance_from_destination, why_visit).
  expected_output: >-
    Structured city guide covering all visited cities: top attractions, local food, safety, weather advice, transit tips, emergency_info, local_events, and nearby_day_trips.
  agent: local_expert
  context:
    - select_city_task

plan_itinerary_task:
  description: >-
    Build a day-by-day itinerary for the {trip_length}-day trip. Each day needs a theme, morning/afternoon/evening plan (<80 words per slot).
    Specify real iconic spots by name. For EACH day, provide itemized line-item `cost_breakdown` summing to `estimated_cost`. No generic catch-all filler line items.
    CRITICAL DESTINATION SCOPE RULE: If {cities} contains only ONE destination city (e.g. "Vijayawada"), ALL {trip_length} days must be spent entirely in that single city. Set the `city` field on EVERY day object to that single city. Do NOT add, invent, or travel to any other cities. ONLY if multiple cities were explicitly requested in {cities} or `cities_visited`, create a multi-city route visiting the requested cities in geographic proximity order (e.g. starting from Delhi to Jaipur and Udaipur, visit adjacent Jaipur first before proceeding to Udaipur).
    The total_estimated_cost MUST NOT exceed {budget} {currency} for {travelers} traveler(s). This is a hard ceiling constraint, not a suggestion, regardless of how large or small the budget is. Budget allocation guideline: ~40% stay, ~35% activities/food, ~25% transit/contingency. Total estimated cost must equal sum of daily costs.

    Provide `recommended_stay` and `budget_upgrade_insights` (+2000 to 3000).
    Output language: "{language}". Keep place/restaurant/hotel names in English script.
  expected_output: >-
    Complete itinerary covering every day in language ({language}), with currency, total estimated cost, daily breakdowns with cost_breakdown and the exact `city` visited for each day, weather_note, travelers count, cost_per_person, recommended stay, budget upgrade insights, transit advice, and packing list.
  agent: travel_concierge
  context:
    - select_city_task
    - gather_city_info_task


revise_itinerary_task:
  description: >-
    Revise the existing trip itinerary according to the traveler's feedback: "{feedback}".
    Current itinerary context: {itinerary}.
    Maintain day-by-day structure, currency, cost breakdowns, and language ({language}).
    Update total_estimated_cost and cost_per_person if modified.
  expected_output: >-
    Revised TripItinerary object reflecting the requested changes.
  agent: travel_concierge

answer_destination_question_task:
  description: >-
    Answer the traveler's question about {destination_city}: "{question}".
    The traveler may ask in English, Telugu, Hindi, or conversational transliteration (like Telish or Hinglish, e.g. "VIJAYWADA LO SUPER BIRYANI KAVALI NAKU BUDGET 150 LO BESTS EVU").
    Understand and answer the question directly. Provide specific, real local restaurant/food stalls, attractions, or tips with exact prices, dish names, and locations in {destination_city}.
    Context/History: {conversation_history}.
    Provide accurate, grounded recommendations with named places and prices. Respond in a friendly and helpful manner matching the user's intent and language style.
  expected_output: >-
    QAResponse with answer containing specific recommendations and details, grounded_claims, ungrounded_claims, and sources.
  agent: local_qa_expert
