select_city_task:
  description: >-
    Compare candidate cities: {cities}. Traveler is departing from {origin} for a {trip_length}-day trip with interests in {interests} and budget of {budget}.
    Search web for weather/seasonal conditions and typical daily costs before deciding.
    If multiple candidate cities are in {cities}, sequence them into an ordered route; set `city` to the FIRST city and `cities_visited` to the ordered list. Otherwise set `city` to that city and `cities_visited` to null.
  expected_output: >-
    A single recommended primary city with country, justification, best time to visit, currency code, estimated daily budget, and cities_visited if multi-city.
  agent: city_selector

gather_city_info_task:
  description: >-
    Research chosen city/cities: top attractions matching {interests}, local food/restaurants, safety notes, and practical transit options.
    Use web search to ground info:
    1. Emergency info: Populate `emergency_info` (`nearest_hospital`, `nearest_police_station`, `national_emergency_number`: "112", `grounded`: true).
    2. Local events & festivals: Populate `local_events` (name, date_or_period, description, `events_grounded`: true).
    3. Nearby day trips: Populate `nearby_day_trips` (name, distance_from_destination, why_visit).
  expected_output: >-
    Structured city guide: top attractions, local food, safety, weather advice, transit tips, emergency_info, local_events, and nearby_day_trips.
  agent: local_expert
  context:
    - select_city_task

plan_itinerary_task:
  description: >-
    Build a day-by-day itinerary for the {trip_length}-day trip. Each day needs a theme, morning/afternoon/evening plan (<80 words per slot).
    Specify real iconic spots by name. For EACH day, provide itemized line-item `cost_breakdown` summing to `estimated_cost`. No generic catch-all filler line items.
    The total_estimated_cost MUST NOT exceed {budget} {currency} for {travelers} traveler(s). This is a hard ceiling constraint, not a suggestion, regardless of how large or small the budget is. Budget allocation guideline: ~40% stay, ~35% activities/food, ~25% transit/contingency. Total estimated cost must equal sum of daily costs.
    Provide `recommended_stay` and `budget_upgrade_insights` (+2000 to 3000).
    Output language: "{language}". Keep place/restaurant/hotel names in English script.
  expected_output: >-
    Complete itinerary covering every day in language ({language}), with currency, total estimated cost, daily breakdowns with cost_breakdown, weather_note, travelers count, cost_per_person, recommended stay, budget upgrade insights, transit advice, and packing list.
  agent: travel_concierge
  context:
    - select_city_task
    - gather_city_info_task


revise_itinerary_task:
  description: >-
    Revise the existing trip itinerary according to the traveler's feedback: "{feedback}".
    Maintain day-by-day structure, currency, cost breakdowns, and language ({language}).
    Update total_estimated_cost and cost_per_person if modified.
  expected_output: >-
    Revised TripItinerary object reflecting the requested changes.
  agent: travel_concierge

answer_destination_question_task:
  description: >-
    Answer user question about {destination_city}: "{question}".
    Context/History: {conversation_history}.
    Provide accurate, grounded recommendations.
  expected_output: >-
    QAResponse with answer, grounded_claims, ungrounded_claims, and sources.
  agent: local_qa_expert
