select_city_task:
  description: >-
    Compare these candidate cities: {cities}. The traveler is departing
    from {origin}, planning a {trip_length}-day trip, with interests in
    {interests} and a total budget of {budget}. Search the web for
    current weather/seasonal conditions (including Indian seasons/monsoons where applicable)
    and typical daily costs in the traveler's stated budget currency for each candidate before deciding.
    Pick exactly one city and justify the choice with specific insights.
  expected_output: >-
    A single recommended city with its country, a clear justification
    referencing the traveler's interests and budget, the best time/season to
    visit, the currency code, and an estimated daily budget.
  agent: city_selector

gather_city_info_task:
  description: >-
    For the city chosen in the previous task, research and compile:
    the top attractions matched to the traveler's interests ({interests}),
    notable local food/restaurants (including regional specialties and dietary preferences),
    safety notes a visitor should know, and practical transportation tips (airport/railway station transfers,
    local cabs, trains, metros, or scooter rentals). Use web search to ground this in current information.
  expected_output: >-
    A structured city guide: a list of top attractions each with a short
    description and approximate cost in the specified currency, a list of local food
    recommendations, a safety-notes paragraph, seasonal weather advice, and a transportation-tips
    paragraph.
  agent: local_expert
  context:
    - select_city_task

plan_itinerary_task:
  description: >-
    Using the city selection and the local city guide already gathered,
    build a day-by-day itinerary for the full {trip_length}-day trip.
    Each day must have a theme, and a morning/afternoon/evening plan.
    Ground activity choices in the attractions and food already researched.
    ALWAYS specify real, famous, iconic spots by name (e.g., exact well-known restaurants with must-try signature dishes, trending cafes, popular shopping malls/cinemas, and scenic landmarks) rather than generic descriptions.
    For EACH day, provide an itemized line-item expense breakdown in cost_breakdown (e.g. [{"item": "Cab fare to temple", "amount": 400}, {"item": "Lunch at Babai Hotel", "amount": 350}]) that sums to that day's estimated_cost.
    Estimate per-day costs (estimated_cost) and total trip cost (total_estimated_cost)
    strictly in the traveler's budget currency, staying within the overall budget of {budget}.
    Ensure the total_estimated_cost is exactly equal to the arithmetic sum of the individual
    estimated_cost values across all days. Provide a practical packing list
    appropriate for the destination and season, and key transit advice.

    LANGUAGE & PLACE NAME INSTRUCTIONS:
    The requested target output language is: "{language}".
    - If "{language}" is "te" (Telugu), write all free-text user-facing descriptions (day theme, morning, afternoon, evening, packing_suggestions, local_transport_advice) in natural Telugu script (తెలుగు).
    - If "{language}" is "hi" (Hindi), write all free-text user-facing descriptions in natural Hindi/Devanagari script (हिंदी).
    - If "{language}" is "en" or unspecified, write in standard English.
    - CRITICAL PLACE NAME RULE: Keep all specific place names, restaurant names, hotel names, street names, and landmark names (e.g., "Kanaka Durga Temple", "Babai Hotel", "Besant Road", "Prakasam Barrage") in English/Roman script across all output languages so they remain clear, searchable, and useful for navigation on maps.
  expected_output: >-
    A complete itinerary covering every day of the trip in the requested output language ({language}), with currency, total
    estimated cost matching the sum of daily estimated costs, daily breakdowns with itemized cost_breakdown lists,
    transit advice, and a packing list matching the schema.
  agent: travel_concierge
  context:
    - select_city_task
    - gather_city_info_task

revise_itinerary_task:
  description: >-
    You are given an EXISTING complete trip itinerary in JSON format:
    {itinerary}

    The traveler has provided the following conversational revision feedback:
    "{feedback}"

    Intelligently revise the itinerary based strictly on the user's feedback:
    1. If the traveler asks for food, biryani, restaurants, cafes, shopping malls, cinemas, or specific attractions, ALWAYS identify and insert real, famous, iconic local spots by exact name (e.g. renowned local restaurants and specific signature dishes, popular shopping malls, trending cafes, and entertainment hubs in that city) into the daily morning/afternoon/evening itinerary. Use web search if needed.
    2. Apply the modifications directly requested or necessary based on the feedback.
    3. Preserve all other existing days, themes, activities, attractions, and costs that were NOT affected by the feedback.
    4. If any day's activities or costs change, re-estimate that day's cost (estimated_cost) and ensure total_estimated_cost is updated to exactly equal the sum of all day costs.
    5. Keep the packing suggestions, destination, currency, and transit advice intact or adjust them if specifically affected by the feedback.

    LANGUAGE & PLACE NAME INSTRUCTIONS:
    The requested target output language is: "{language}".
    - If "{language}" is "te" (Telugu), write all free-text descriptions in natural Telugu script (తెలుగు).
    - If "{language}" is "hi" (Hindi), write all free-text descriptions in natural Hindi script (हिंदी).
    - If "{language}" is "en" or unspecified, write in standard English.
    - CRITICAL PLACE NAME RULE: Keep all specific place names, restaurant names, landmark names, and street names in English/Roman script.
  expected_output: >-
    A complete revised TripItinerary model reflecting the user's requested changes in the target language ({language}) with specific named places and restaurants while preserving the rest of the original itinerary.
  agent: travel_concierge

answer_destination_question_task:
  description: >-
    The traveler is visiting {destination_city} and has asked the following specific question:
    "{question}"

    Prior Conversation History in this session:
    {conversation_history}

    Instructions:
    1. Multi-Turn Context: Use the prior conversation history naturally to resolve references or follow-up queries (e.g. if the user previously asked about biryani and now asks "what about something cheaper" or "what about vegetarian options near there", recognize what they are referring to).
    2. Decompose Compound Questions: If the question has multiple parts or topics (e.g. asking about food/biryani AND shopping malls/cinemas), decompose the question and search for EACH part separately using web search before answering.
    3. No Redundant Searches: Once you find 1-2 reliable places for a sub-topic, immediately search for the remaining parts of the question.
    4. Strict Local Grounding: Ground all recommendations strictly in real, named establishments located in {destination_city}.
    5. Self-Report Grounding: After formulating the answer, explicitly categorize your statements:
       - grounded_claims: List specific named places, establishments, or facts directly verified by tool search results.
       - ungrounded_claims: List any general advice, assertions, or statements not backed by a specific search result. If everything in the answer is verified by search results, return an empty list ([]).
    6. Provide a direct, helpful, and concise answer (3-6 sentences).

    LANGUAGE & PLACE NAME INSTRUCTIONS:
    The requested target output language is: "{language}".
    - If "{language}" is "te" (Telugu), write the answer text in natural Telugu script (తెలుగు).
    - If "{language}" is "hi" (Hindi), write the answer text in natural Hindi script (हिंदी).
    - If "{language}" is "en" or unspecified, write in standard English.
    - CRITICAL PLACE NAME RULE: Keep all specific establishment names, restaurant names, and landmark names in English/Roman script.
  expected_output: >-
    A structured QAResponse JSON containing:
    - answer: direct 3-6 sentence response in the target language ({language}) naming specific real-world places in {destination_city}.
    - grounded_claims: list of specific named places/facts directly verified by tool search results.
    - ungrounded_claims: list of statements based on general knowledge without search result backing (empty list if all grounded).
  agent: local_qa_expert
